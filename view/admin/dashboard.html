<style>
    /* Alulról felfelé belebegő animáció (--rise: ennyit mozdul, --delay: késleltetés) */
    .fade-up {
        --rise: 16px;
        animation: fadeUp 0.6s ease-out backwards;
        animation-delay: var(--delay, 0s);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(var(--rise)); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        .fade-up, .chart-bar { animation: none; }
    }
</style>

<h3 class="fade-up">Vezérlőpult</h3>
<hr>

<!--Összesítő kártyák-->
<div class="row g-3 mb-4">
    <div class="col-sm-4 fade-up" style="--delay: 0.05s">
        <div class="card shadow-sm h-100">
            <div class="card-body d-flex align-items-center gap-3">
                <i class="bi bi-cloud-sun-fill fs-1 text-primary"></i>
                <div>
                    <div class="fs-3 fw-bold" id="statForecasts">–</div>
                    <div class="text-body-secondary small">Előrejelzés</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-sm-4 fade-up" style="--delay: 0.12s">
        <div class="card shadow-sm h-100">
            <div class="card-body d-flex align-items-center gap-3">
                <i class="bi bi-geo-alt-fill fs-1 text-danger"></i>
                <div>
                    <div class="fs-3 fw-bold" id="statLocations">–</div>
                    <div class="text-body-secondary small">Helység</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-sm-4 fade-up" style="--delay: 0.19s">
        <div class="card shadow-sm h-100">
            <div class="card-body d-flex align-items-center gap-3">
                <i class="bi bi-people-fill fs-1 text-success"></i>
                <div>
                    <div class="fs-3 fw-bold" id="statUsers">–</div>
                    <div class="text-body-secondary small">Regisztrált felhasználó</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!--Új előrejelzés felszerkeztése-->
<div class="card shadow-sm mb-4 fade-up" style="--delay: 0.26s">
    <div class="card-body">
        <h5 class="card-title mb-3"><i class="bi bi-plus-circle me-2"></i>Új előrejelzés felvétele</h5>

        <form id="newWeatherForm" onsubmit="createWeather(event)">
            <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label" for="nw-date">Dátum</label>
                <input type="date" class="form-control" id="nw-date" required>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="nw-location">Helység</label>
                <input type="text" class="form-control" id="nw-location" maxlength="100" placeholder="pl. Baja" required>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="nw-weather_type">Időjárás típusa</label>
                <input type="text" class="form-control" id="nw-weather_type" list="weatherTypes" maxlength="50" placeholder="pl. Napos" required>
            </div>
            <div class="col-sm-6 col-lg-3">
                <label class="form-label" for="nw-temp_min">Minimum hőmérséklet</label>
                <div class="input-group"><input type="number" class="form-control" id="nw-temp_min" step="0.1" min="-60" max="60" required><span class="input-group-text">°C</span></div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <label class="form-label" for="nw-temp_max">Maximum hőmérséklet</label>
                <div class="input-group"><input type="number" class="form-control" id="nw-temp_max" step="0.1" min="-60" max="60" required><span class="input-group-text">°C</span></div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <label class="form-label" for="nw-precipitation">Csapadék mennyisége</label>
                <div class="input-group"><input type="number" class="form-control" id="nw-precipitation" step="0.1" min="0" max="1000"><span class="input-group-text">mm</span></div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <label class="form-label" for="nw-precipitation_probability">Csapadék valószínűsége</label>
                <div class="input-group"><input type="number" class="form-control" id="nw-precipitation_probability" step="1" min="0" max="100"><span class="input-group-text">%</span></div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <label class="form-label" for="nw-wind_speed">Szélsebesség</label>
                <div class="input-group"><input type="number" class="form-control" id="nw-wind_speed" step="0.1" min="0" max="400"><span class="input-group-text">km/h</span></div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <label class="form-label" for="nw-wind_direction">Szélirány</label>
                <select class="form-select" id="nw-wind_direction"><option value="">–</option><option value="É">É</option><option value="ÉK">ÉK</option><option value="K">K</option><option value="DK">DK</option><option value="D">D</option><option value="DNy">DNy</option><option value="Ny">Ny</option><option value="ÉNy">ÉNy</option></select>
            </div>
            <div class="col-sm-6 col-lg-3">
                <label class="form-label" for="nw-humidity">Páratartalom</label>
                <div class="input-group"><input type="number" class="form-control" id="nw-humidity" step="1" min="0" max="100"><span class="input-group-text">%</span></div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <label class="form-label" for="nw-pressure">Légnyomás</label>
                <div class="input-group"><input type="number" class="form-control" id="nw-pressure" step="1" min="0" max="1100"><span class="input-group-text">hPa</span></div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <label class="form-label" for="nw-uv_index">UV-index</label>
                <input type="number" class="form-control" id="nw-uv_index" step="1" min="0" max="15">
            </div>
            <datalist id="weatherTypes"><option value="Napos"><option value="Derült"><option value="Részben felhős"><option value="Felhős"><option value="Esős"><option value="Zivatar"><option value="Hóesés"><option value="Ködös"></datalist>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Felvétel</button>
                <button type="reset" class="btn btn-outline-secondary">Törlés</button>
                <button type="button" class="btn btn-outline-primary ms-auto" onclick="navigate('admin/weather')">
                    <i class="bi bi-table me-1"></i>Előrejelzések kezelése
                </button>
            </div>
        </form>
    </div>
</div>
