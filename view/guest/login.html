<div class="col-lg-6 offset-lg-3">
<h3>Login form</h3>
<p>Jelentkezz be, hogy még több tartalmat láss!</p>
<hr>

<div class="form-floating mb-3">
  <input type="email" class="form-control" id="email" placeholder="name@example.com">
  <label for="email">Email address</label>
</div>

<div class="form-floating mb-3">
  <input type="password" class="form-control" id="password" placeholder="Password">
  <label for="password">Password</label>
</div>

<button type="button" class="btn btn-outline-secondary" onclick="login()"><i class="bi bi-box-arrow-in-right"></i> Bejelentkezés</button>
<p>Nincs még accountod? <a href="#" onclick="navigate('guest/register')">Regisztráció!</a></p>
</div>
