<div class="row">
<h3>Profilom</h3>
<hr>
<div class="col-lg-6">

<h6><i class="bi bi-arrow-repeat"></i> Update profile</h6>

<div class="form-floating mb-3">
  <input type="text" class="form-control" id="name" placeholder="">
  <label for="name">Username</label>
</div>

<div class="form-floating mb-3">
  <input type="email" class="form-control" id="email" placeholder="name@example.com">
  <label for="email">Email address</label>
</div>
<button type="button" class="btn btn-primary mb-3" onclick="updateProfile()"><i class="bi bi-arrow-repeat"></i>&nbsp;&nbsp;Update</button>
</div>

<div class="col-lg-6">
<h6><i class="bi bi-key"></i>&nbsp;&nbsp;Update password</h6>

<div class="form-floating mb-3">
  <input type="password" class="form-control" id="password" placeholder="Password">
  <label for="password">Old Password</label>
</div>
<div class="form-floating mb-3">
  <input type="password" class="form-control" id="password" placeholder="Password">
  <label for="password">Password</label>
</div>

<div class="form-floating mb-3">
  <input type="password" class="form-control" id="confirm" placeholder="">
  <label for="confirm">Confirm password</label>
</div>
<button type="button" class="btn btn-primary mb-3" onclick="updatePassword()"><i class="bi bi-arrow-repeat"></i>&nbsp;&nbsp;Update password</button>

</div>
</div>
