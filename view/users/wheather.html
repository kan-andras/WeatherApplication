<style>
    .fade-up {
        --rise: 16px;
        animation: fadeUp 0.6s ease-out backwards;
        animation-delay: var(--delay, 0s);
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(var(--rise));
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .weather-card {
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .weather-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
    }

    .detail-tile {
        border: 1px solid var(--bs-border-color);
        border-radius: 0.75rem;
        padding: 0.75rem 1rem;
    }

    @media (prefers-reduced-motion: reduce) {
        .fade-up {
            animation: none;
        }
    }
</style>

<h3 class="fade-up"><i class="bi bi-cloud-sun"></i> Időjárás</h3>
<hr>

<div class="card shadow-sm mx-auto mb-4 text-center fade-up" style="max-width: 720px; --delay: 0.1s;">
    <div class="card-body py-4">
        <h4 class="mt-2 mb-1">Üdvözlünk itt, <span id="welcomeName"></span>!</h4>
        <p class="text-body-secondary mb-0 text-center">
            Itt találod a legfrissebb időjárási adatokat, ha többet akarsz tudni csak kattints egy napra.
        </p>
    </div>
</div>

<div id="userWeatherDetail" class="card shadow-sm mb-4 d-none">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <h5 id="detailTitle" class="mb-0"></h5>
            <button type="button" class="btn-close" aria-label="Bezár" onclick="closeUserWeatherDetail()"></button>
        </div>
        <p id="detailSubtitle" class="text-body-secondary mb-3"></p>
        <div class="row g-3" id="detailBody"></div>
    </div>
</div>

<div class="row g-3 mb-4" id="userWeatherList">
    <div class="col-12 text-center text-body-secondary">Betöltés...</div>
</div>
